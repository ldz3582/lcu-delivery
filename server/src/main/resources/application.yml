server:
  port: 8080

spring:
  application:
    name: lcu-delivery
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/lcu_delivery?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:lcu}
    password: ${DB_PASSWORD:lcu123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  # 图片上传：Spring 默认只允许 1MB，菜品图/门店照经常 2~4MB，必须放开到 5MB
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt-secret: ${JWT_SECRET:lcu-delivery-dev-secret-key-change-in-production-32}
  token-expire-hours: 168
  # 敏感字段（学号/身份证/手机号）AES-GCM 加密密钥：生产必须用环境变量覆盖
  crypto-key: ${APP_CRYPTO_KEY:lcu-delivery-demo-crypto-key-32bytes!}
  # 本地/内测：跳过真实微信登录与支付，便于无商户号时跑通链路；生产必须关掉
  mock-login: ${APP_MOCK_LOGIN:true}
  mock-pay: ${APP_MOCK_PAY:true}
  # 提交订单时是否强制围栏校验
  fence-enforce: ${APP_FENCE_ENFORCE:true}
  # T+N 结算冻结天数
  settle-freeze-days: ${APP_SETTLE_FREEZE_DAYS:1}
  # 上传文件落盘目录（生产可换对象存储，只需改 UploadController）
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  # 图片对外访问的绝对地址前缀；留空则按请求 Host 自动拼
  public-base-url: ${APP_PUBLIC_BASE_URL:}

wechat:
  miniapp:
    appid: ${WX_USER_APPID:}
    secret: ${WX_USER_SECRET:}
  # 公众号（服务号）：H5 在微信内打开时用它做网页授权，拿 openid 后走 JSAPI 支付。
  # 不配则 H5 只能走微信外 H5 支付（MWEB）。
  official:
    appid: ${WX_MP_APPID:}
    secret: ${WX_MP_SECRET:}
  # 微信支付 v3（JSAPI）。app.mock-pay=false 时这 6 项必须齐全，否则启动即失败。
  # 回调地址必须公网 HTTPS 且已在小程序后台配好 request 合法域名。
  pay:
    mch-id: ${WXPAY_MCH_ID:}
    serial-no: ${WXPAY_MCH_SERIAL_NO:}
    api-v3-key: ${WXPAY_API_V3_KEY:}
    private-key-path: ${WXPAY_PRIVATE_KEY_PATH:}
    notify-url: ${WXPAY_NOTIFY_URL:}

logging:
  level:
    root: info
    com.lcu.delivery: debug
