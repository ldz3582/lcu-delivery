# 单机入口：80 → 管理后台静态站 + /api 反代后端
# 管理后台用 history 路由，必须 try_files 回落 index.html

upstream lcu_api {
    server api:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    charset utf-8;
    # 后端限制单文件 5MB / 单请求 10MB，这里留一点余量
    client_max_body_size 12m;

    access_log /var/log/nginx/lcu.access.log;
    error_log  /var/log/nginx/lcu.error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # ---- 后端接口 ----
    location /api/ {
        proxy_pass http://lcu_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- 上传图片（后端静态目录） ----
    location /uploads/ {
        proxy_pass http://lcu_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- 健康检查（部署脚本 / 手工验收用） ----
    location = /health {
        proxy_pass http://lcu_api/actuator/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- 小程序 H5 预览（可选，构建出 h5 目录才生效） ----
    location /h5/ {
        alias /usr/share/nginx/h5/;
        try_files $uri $uri/ /h5/index.html;
    }

    # ---- 管理后台静态站 ----
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
