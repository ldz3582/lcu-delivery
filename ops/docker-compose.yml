# 本地开发依赖服务：MySQL 8.4 + Redis 7.4 + MinIO（替代云 OSS）
# 用法：
#   cp .env.example .env
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f mysql
# 全部为 arm64/amd64 多架构镜像，Apple Silicon 可直接运行。

name: lcu-delivery

services:
  mysql:
    image: mysql:8.4
    container_name: lcu-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max_connections=300
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lcu_delivery}
      MYSQL_USER: ${MYSQL_USER:-lcu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lcu123456}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
      - ./sql/demo.sql:/docker-entrypoint-initdb.d/30-demo.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: lcu-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis123456}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: lcu-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # 可选：本地消息队列。一期用 Redis 即可，需要 RocketMQ 时再打开。
  # rocketmq-namesrv:
  #   image: apache/rocketmq:5.3.1
  #   command: sh mqnamesrv
  #   ports: ["9876:9876"]

